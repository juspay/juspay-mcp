[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "juspay-mcp"
version = "0.1.0"
description = "Tools for Juspay"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.8",
    "httpx>=0.28.1",
    "mcp==1.28.1",
    "python-dotenv>=1.1.0",
    "starlette>=0.46.1",
    "uvicorn>=0.34.0",
    "requests==2.32.3",
    "markdownify>=0.11.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# In-app KMS decrypt of CLI_ANALYTICS_INGEST_TOKEN (Juspay deployment: install juspay-mcp[kms]).
# Self-hosters can omit this and pass the token as plaintext.
kms = ["boto3>=1.34.0"]

[tool.setuptools]
packages = ["juspay_mcp", "juspay_mcp.api", "juspay_mcp.api_schema", "juspay_mcp.auth", "juspay_mcp.analytics", "juspay_dashboard_mcp", "juspay_dashboard_mcp.api", "juspay_dashboard_mcp.api_schema", "juspay_docs_mcp", "juspay_ai_studio_mcp", "juspay_ai_studio_mcp.api", "juspay_ai_studio_mcp.api_schema"]

[tool.setuptools.package-data]
juspay_docs_mcp = ["transcripts.json", "dataset/*.json"]

[project.scripts]
juspay-mcp = "juspay_mcp.main:main"
