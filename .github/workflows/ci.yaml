name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  checks:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: "Install Nix"
        uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake
        env:
          NIX_CONFIG: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        run: nix flake check --accept-flake-config --print-build-logs

      - name: Build flake outputs
        env:
          NIX_CONFIG: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep this list in sync with the packages/devShells defined under ./nix.
          system="${{ matrix.system }}"
          nix build --accept-flake-config --print-build-logs --no-link \
            ".#packages.${system}.default" \
            ".#packages.${system}.stdio" \
            ".#packages.${system}.test" \
            ".#packages.${system}.docker" \
            ".#packages.${system}.docker-sse" \
            ".#packages.${system}.docker-dashboard" \
            ".#packages.${system}.docker-dashboard-sse" \
            ".#devShells.${system}.default"
